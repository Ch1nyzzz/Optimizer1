[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optiharness"
version = "0.1.0"
description = "Optimization harness for benchmark-specific agent evolution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "mcp>=1.0",
  "openai>=1.40",
]

[project.optional-dependencies]
external = []
source = []
# Terminal-Bench 2.0 (Terminus) target: Harbor drives the rollouts. Harbor is
# invoked as a console command (`harbor run ...`) by optimizer1.terminus, so it
# must be importable / on PATH in the active environment.
terminus = [
  "harbor>=0.3,<1",
  "litellm>=1.8",
  "tenacity>=9",
  "python-dotenv>=1.2",
]
dev = [
  "pytest>=8.0",
]
[project.scripts]
optiharness = "optiharness.cli:main"
optimizer1 = "optimizer1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optimizer1.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
